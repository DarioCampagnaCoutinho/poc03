services:
  app:
    build: .
    image: poc03-app
    container_name: poc03-app
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: poc03-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
